name: Fable Engine v3 CI Pipeline

on:
  push:
    branches:
      - main
      - "wave-*"
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Build, Typecheck, Lint, Unit & Acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Topological build across all 29 packages
        run: npm run build

      - name: Strict TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint across backend, frontend, ui, scripts & tests
        run: npm run lint

      - name: Run all workspace unit tests
        run: npm test

      - name: Run Master Acceptance Checklist suite
        run: npm run test:acceptance
