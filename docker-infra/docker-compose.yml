services:
  # Tier 0 Persistence: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: fable-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_password
      POSTGRES_DB: fable_temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d fable_temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Tier 0: Temporal.io Durable Orchestrator
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: fable-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal_password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
      - "8233:8233"

  # Tier 5 Dispatch: Redis for BullMQ re-verification dispatch
  redis:
    image: redis:7-alpine
    container_name: fable-redis
    ports:
      - "6379:6379"

  # Sandboxed Artifact Storage: MinIO
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: fable-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fable_minio_admin
      MINIO_ROOT_PASSWORD: fable_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
